name: Brine (Tanx)
description: >-
  Brine — now rebranded as tanX — is a cross-chain, self-custodial orderbook
  decentralized exchange (DEX) built on StarkWare's StarkEx Layer-2 scaling
  engine. It combines the trustless, non-custodial security of a DEX with the
  speed and low fees of a centralized exchange: gasless trading, rapid off-chain
  order execution with on-chain settlement, cross-chain deposits and withdrawals,
  and simple APIs for programmatic trading. The company is backed by Pantera
  Capital and is repositioning around "a secure and compliant future for crypto."
  This API Evangelist profile was seeded from Pantera Capital's portfolio and
  enriched by the pipeline; as of this pass the public REST API host is no longer
  reachable and the developer surface is limited to the GitBook documentation.
